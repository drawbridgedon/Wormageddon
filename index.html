<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wormageddon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; font-family: monospace; }
    #canvas { position: fixed; top: 0; left: 0; }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #ccc;
      font-size: 14px;
      line-height: 1.8;
      pointer-events: none;
    }

    /* ── Editor panel ─────────────────────────────────────── */
    #editor {
      position: fixed;
      right: 0; top: 0;
      width: 230px; height: 100%;
      background: rgba(14, 14, 14, 0.95);
      border-left: 1px solid #2a2a2a;
      overflow-y: auto;
      z-index: 20;
      font-size: 12px;
      color: #bbb;
      padding: 12px 12px 24px;
      transition: transform 0.2s ease;
    }
    #editor.collapsed { transform: translateX(230px); }

    #editor-tab {
      position: fixed;
      right: 230px; top: 50%;
      transform: translateY(-50%);
      background: rgba(14,14,14,0.95);
      border: 1px solid #2a2a2a;
      border-right: none;
      padding: 10px 5px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
      color: #888;
      writing-mode: vertical-lr;
      letter-spacing: 2px;
      z-index: 21;
      transition: right 0.2s ease;
      user-select: none;
    }
    #editor-tab.collapsed { right: 0; }
    #editor-tab:hover { color: #ccc; }

    #editor h3 {
      font-size: 13px;
      color: #eee;
      margin-bottom: 14px;
      letter-spacing: 1px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 8px;
    }

    .ed-label {
      display: flex;
      justify-content: space-between;
      margin: 10px 0 3px;
      font-size: 11px;
      color: #777;
    }
    .ed-label span { color: #ddd; font-weight: bold; }

    input[type=range] {
      width: 100%;
      accent-color: #4ade80;
      cursor: pointer;
    }
    input[type=text] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #eee;
      padding: 5px 7px;
      font-family: monospace;
      font-size: 12px;
    }
    input[type=color] {
      width: 100%;
      height: 30px;
      border: 1px solid #333;
      background: none;
      cursor: pointer;
      padding: 2px;
    }

    #ed-save {
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      background: #0e1f0e;
      border: 1px solid #4ade80;
      color: #4ade80;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }
    #ed-save:hover { background: #1a3a1a; }

    #ed-list {
      margin-top: 16px;
      border-top: 1px solid #2a2a2a;
      padding-top: 12px;
    }
    #ed-list-title {
      font-size: 11px;
      color: #555;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .ed-card {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 0;
      border-bottom: 1px solid #1c1c1c;
    }
    .ed-swatch {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ed-card-info {
      flex: 1;
      overflow: hidden;
    }
    .ed-card-name {
      font-size: 12px;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ed-card-stats {
      font-size: 10px;
      color: #555;
      margin-top: 1px;
    }
    .ed-spawn {
      padding: 4px 8px;
      background: #0e0e1f;
      border: 1px solid #6366f1;
      color: #818cf8;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
      flex-shrink: 0;
    }
    .ed-spawn:hover { background: #1a1a3a; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud"></div>

  <!-- Editor panel tab -->
  <div id="editor-tab">BUILD</div>

  <!-- Editor panel -->
  <div id="editor">
    <h3>Worm Builder</h3>

    <div class="ed-label">Name</div>
    <input id="ed-name" type="text" value="Custom" maxlength="14">

    <div class="ed-label">Color</div>
    <input id="ed-color" type="color" value="#ff6b6b">

    <div class="ed-label">Speed <span id="ed-speed-val">2.0</span></div>
    <input id="ed-speed" type="range" min="1" max="5" step="0.5" value="2">

    <div class="ed-label">Food drive <span id="ed-food-val">5</span></div>
    <input id="ed-food" type="range" min="0" max="10" step="1" value="5">

    <div class="ed-label">Aggression <span id="ed-aggro-val">2</span></div>
    <input id="ed-aggro" type="range" min="0" max="10" step="1" value="2">

    <div class="ed-label">Wander <span id="ed-wander-val">2</span></div>
    <input id="ed-wander" type="range" min="0" max="10" step="1" value="2">

    <button id="ed-save">Save Archetype</button>

    <div id="ed-list">
      <div id="ed-list-title">SAVED ARCHETYPES</div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
