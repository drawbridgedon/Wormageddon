<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wormageddon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; font-family: monospace; }
    #canvas { position: fixed; top: 0; left: 0; }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #ccc;
      font-size: 14px;
      line-height: 1.8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
